<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Controller Designer</title>
<link rel="stylesheet" href="../shared/bc-theme.css?v=20260927">
<script>window.BC_CLOUD_SAVE = { app: 'controllerdesigner', keys: ['controllerDesigner_sync_v1'] };</script>
<script src="../shared/cloud-save.js?v=20260927"></script>
<style>
  /* The site's dark theme (shared/bc-theme.css). The board is dark paper
     with light inks, like the notepad. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none;
  }
  header {
    padding: 12px 16px;
    background: var(--bg);
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .tool-group { display: flex; align-items: center; gap: 6px; }
  .tool-btn {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--surface-2);
    border-radius: 999px;
    padding: 7px 12px;
    font: inherit;
    font-size: 13px;
    font-weight: 650;
    color: var(--ink);
    cursor: pointer;
  }
  .tool-btn:hover { background: var(--surface-3); }
  .tool-btn.is-active { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .tool-btn.is-danger.is-armed { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }

  .swatch-row { display: flex; gap: 5px; }
  .swatch {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--line-strong);
    cursor: pointer;
    padding: 0;
  }
  .swatch.is-active { box-shadow: 0 0 0 2px var(--brand); }
  #customColor { width: 30px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0; cursor: pointer; background: none; }

  .size-label { font-size: 12px; color: var(--muted); font-weight: 650; white-space: nowrap; }
  #brushSize { width: 90px; }

  .canvas-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    min-height: 0;
  }
  #board {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    box-shadow: var(--shadow-3);
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .text-editor-overlay {
    position: absolute;
    display: flex;
    align-items: stretch;
    gap: 5px;
    z-index: 10;
    padding: 5px;
    border: 2px solid var(--brand);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow-3);
    touch-action: manipulation;
  }
  .text-input-overlay {
    width: 220px;
    min-width: 100px;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 5px 7px;
    outline: none;
    font: 600 18px var(--font-body);
  }
  .text-input-overlay:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .text-editor-action {
    appearance: none;
    border: 0;
    border-radius: 5px;
    padding: 4px 9px;
    font: 600 12px var(--font-body);
    cursor: pointer;
    touch-action: manipulation;
  }
  .text-editor-add { background: var(--brand); color: var(--on-brand); }
  .text-editor-cancel { background: var(--surface-3); color: var(--ink); }
  .text-editor-action:focus-visible { outline: 2px solid var(--brand-dark); outline-offset: 2px; }
  .status-note {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    background: rgba(15, 17, 21, .8);
    padding: 3px 10px;
    border-radius: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <h1>Controller Designer</h1>
  <p>Design a controller for a games console that doesn't exist yet. Draw it, then use the text tool to label the parts.</p>
</header>
<div class="toolbar">
  <div class="tool-group">
    <button type="button" class="tool-btn is-active" id="toolPen">Pen</button>
    <button type="button" class="tool-btn" id="toolEraser">Eraser</button>
    <button type="button" class="tool-btn" id="toolText">Text</button>
  </div>
  <div class="tool-group swatch-row" id="swatchRow"></div>
  <div class="tool-group">
    <input type="color" id="customColor" value="#e8eaed" title="Custom colour">
  </div>
  <div class="tool-group">
    <span class="size-label">Size</span>
    <input type="range" id="brushSize" min="2" max="30" value="6">
  </div>
  <div class="tool-group">
    <button type="button" class="tool-btn" id="btnUndo">Undo</button>
    <button type="button" class="tool-btn is-danger" id="btnClear">Clear Canvas</button>
    <button type="button" class="tool-btn" id="btnSave">Save as PNG</button>
  </div>
</div>
<div class="canvas-wrap">
  <canvas id="board" width="900" height="600"></canvas>
  <div class="status-note" id="statusNote">Drawings save automatically.</div>
</div>

<script>
(function () {
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var AUTOSAVE_KEY = 'controllerDesigner_autosave_v1';

  var state = {
    tool: 'pen',
    color: '#e8eaed',
    size: 6,
    drawing: false,
    lastX: 0,
    lastY: 0,
    undoStack: [],
    textEditor: null
  };

  // The notepad's inks, chosen to read on the dark board.
  var PALETTE = ['#e8eaed', '#f28b82', '#8ab4f8', '#81c995', '#fdd663', '#c58af9', '#9aa0a6'];
  var BOARD = '#171a20';
  var DARK_KEY = 'controllerDesigner_dark_v1';

  function fillBoard() {
    ctx.save();
    ctx.fillStyle = BOARD;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // The drawing itself is a lossless PNG in this browser. The account gets a
  // copy small enough for one save (shared/cloud-save.js mirrors SYNC_KEY):
  // the PNG when it fits, otherwise WebP at lower quality and size until it
  // does. SAVED_AT_KEY says which drawing the PNG
  // is, so a newer one from another computer is loaded instead.
  var SYNC_KEY = 'controllerDesigner_sync_v1';
  var SAVED_AT_KEY = 'controllerDesigner_savedAt_v1';
  var SYNC_MAX_CHARS = 42000;

  function readSync() {
    try { var s = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); return s && s.img ? s : null; } catch (_e) { return null; }
  }

  // [quality, scale], from best to smallest. The last always fits. A drawing
  // mostly grows, so each save starts one step before the last fit. Browsers
  // that cannot write WebP (Safari) use JPEG.
  var COMPACT_TRIES = [[1, 1], [0.9, 1], [0.8, 1], [0.7, 1], [0.8, 0.75], [0.7, 0.6], [0.6, 0.5], [0.5, 0.4], [0.4, 0.3], [0.3, 0.2]];
  var COMPACT_TYPE = document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0 ? 'image/webp' : 'image/jpeg';
  var lastFit = 0;
  function compactCopy(png) {
    if (png.length <= SYNC_MAX_CHARS) { lastFit = 0; return png; }
    var tries = COMPACT_TRIES;
    var small = document.createElement('canvas'), sctx = small.getContext('2d');
    for (var i = Math.max(0, lastFit - 1); i < tries.length; i++) {
      var q = tries[i][0], scale = tries[i][1], src = canvas;
      if (scale < 1) {
        small.width = Math.round(canvas.width * scale);
        small.height = Math.round(canvas.height * scale);
        sctx.drawImage(canvas, 0, 0, small.width, small.height);
        src = small;
      }
      var url = src.toDataURL(COMPACT_TYPE, q);
      if (url.length <= SYNC_MAX_CHARS) { lastFit = i; return url; }
    }
    return null;
  }

  function loadAutosave() {
    var saved, savedAt = 0, sync = readSync();
    try { saved = localStorage.getItem(AUTOSAVE_KEY); savedAt = Number(localStorage.getItem(SAVED_AT_KEY)) || 0; } catch (_e) { saved = null; }
    var fromAccount = sync && (!saved || sync.at > savedAt);
    var source = fromAccount ? sync.img : saved;
    if (!source) { fillBoard(); return; }
    var img = new Image();
    img.onload = function () {
      fillBoard();
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      if (fromAccount) {
        try {
          localStorage.setItem(AUTOSAVE_KEY, canvas.toDataURL('image/png'));
          localStorage.setItem(SAVED_AT_KEY, String(sync.at));
        } catch (_e) {}
        try { localStorage.setItem(DARK_KEY, '1'); } catch (_e) {}
      } else {
        migrateToDark();
        if (!sync && saved) autosave(); // a drawing from before account saving
      }
    };
    img.onerror = function () { fillBoard(); };
    img.src = source;
  }

  // Drawings saved before the board went dark are on white paper. Once, turn
  // the paper into the board and dark or grey ink into light ink, so they
  // still show. Coloured ink already reads on the dark board, so it stays.
  function migrateToDark() {
    var done = false;
    try { done = localStorage.getItem(DARK_KEY) === '1'; } catch (_e) {}
    if (done) return;
    try { localStorage.setItem(DARK_KEY, '1'); } catch (_e) {}
    var corner = ctx.getImageData(2, 2, 1, 1).data;
    if (corner[0] < 240 || corner[1] < 240 || corner[2] < 240) return;
    var image = ctx.getImageData(0, 0, canvas.width, canvas.height), px = image.data;
    var board = [0x17, 0x1a, 0x20], ink = [0xe8, 0xea, 0xed];
    for (var i = 0; i < px.length; i += 4) {
      var r = px[i], g = px[i + 1], b = px[i + 2];
      if (Math.max(r, g, b) - Math.min(r, g, b) < 40) {
        var light = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        for (var c = 0; c < 3; c++) px[i + c] = Math.round(board[c] + (1 - light) * (ink[c] - board[c]));
      }
    }
    ctx.putImageData(image, 0, 0);
    autosave();
  }

  function autosave() {
    var at = Date.now(), png = canvas.toDataURL('image/png');
    try {
      localStorage.setItem(AUTOSAVE_KEY, png);
      localStorage.setItem(SAVED_AT_KEY, String(at));
    } catch (_e) { /* storage full or unavailable, not critical */ }
    var copy = compactCopy(png);
    try {
      if (copy) localStorage.setItem(SYNC_KEY, JSON.stringify({ at: at, img: copy }));
    } catch (_e) {}
  }

  function pushUndoSnapshot() {
    try {
      state.undoStack.push(canvas.toDataURL('image/png'));
      if (state.undoStack.length > 25) state.undoStack.shift();
    } catch (_e) { /* ignore */ }
  }

  function undo() {
    if (!state.undoStack.length) return;
    var last = state.undoStack.pop();
    var img = new Image();
    img.onload = function () {
      fillBoard();
      ctx.drawImage(img, 0, 0);
      autosave();
    };
    img.src = last;
  }

  // ── Toolbar wiring ──────────────────────────────────────────────
  function setTool(tool) {
    closeTextEditor(false);
    state.tool = tool;
    ['toolPen', 'toolEraser', 'toolText'].forEach(function (id) {
      document.getElementById(id).classList.remove('is-active');
    });
    var map = { pen: 'toolPen', eraser: 'toolEraser', text: 'toolText' };
    document.getElementById(map[tool]).classList.add('is-active');
    canvas.style.cursor = tool === 'text' ? 'text' : 'crosshair';
    document.getElementById('statusNote').textContent = tool === 'text'
      ? 'Click the canvas, type a label, then press Enter or Add text.'
      : 'Drawings save automatically.';
  }
  document.getElementById('toolPen').addEventListener('click', function () { setTool('pen'); });
  document.getElementById('toolEraser').addEventListener('click', function () { setTool('eraser'); });
  document.getElementById('toolText').addEventListener('click', function () { setTool('text'); });

  var swatchRow = document.getElementById('swatchRow');
  PALETTE.forEach(function (color) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch';
    btn.style.background = color;
    btn.title = color;
    btn.addEventListener('click', function () {
      state.color = color;
      document.getElementById('customColor').value = color;
      Array.prototype.forEach.call(swatchRow.querySelectorAll('.swatch'), function (s) { s.classList.remove('is-active'); });
      btn.classList.add('is-active');
    });
    swatchRow.appendChild(btn);
    if (color === state.color) btn.classList.add('is-active');
  });

  document.getElementById('customColor').addEventListener('input', function (e) {
    state.color = e.target.value;
    Array.prototype.forEach.call(swatchRow.querySelectorAll('.swatch'), function (s) { s.classList.remove('is-active'); });
  });

  document.getElementById('brushSize').addEventListener('input', function (e) {
    state.size = Number(e.target.value);
  });

  document.getElementById('btnUndo').addEventListener('click', undo);

  // Two-click confirm instead of window.confirm(): a native dialog can be
  // silently blocked in a sandboxed iframe with no allow-modals, same
  // lesson learned building Hex Machine's Reset Game button.
  var clearBtn = document.getElementById('btnClear');
  var clearArmed = false, clearTimer = null;
  clearBtn.addEventListener('click', function () {
    if (!clearArmed) {
      clearArmed = true;
      clearBtn.classList.add('is-armed');
      clearBtn.textContent = 'Click again to clear';
      clearTimer = setTimeout(function () {
        clearArmed = false;
        clearBtn.classList.remove('is-armed');
        clearBtn.textContent = 'Clear Canvas';
      }, 3000);
      return;
    }
    clearTimeout(clearTimer);
    clearArmed = false;
    clearBtn.classList.remove('is-armed');
    clearBtn.textContent = 'Clear Canvas';
    pushUndoSnapshot();
    fillBoard();
    autosave();
  });

  document.getElementById('btnSave').addEventListener('click', function () {
    var link = document.createElement('a');
    link.download = 'my-controller-design.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  // ── Drawing (pen / eraser) ──────────────────────────────────────
  function canvasPoint(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function strokeTo(x, y) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = state.tool === 'eraser' ? state.size * 3 : state.size;
    ctx.strokeStyle = state.tool === 'eraser' ? BOARD : state.color;
    ctx.beginPath();
    ctx.moveTo(state.lastX, state.lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    state.lastX = x;
    state.lastY = y;
  }

  function closeTextEditor(commitText) {
    var editor = state.textEditor;
    if (!editor) return;
    state.textEditor = null;

    if (commitText) {
      var text = editor.input.value.trim();
      if (text) {
        pushUndoSnapshot();
        ctx.save();
        ctx.fillStyle = editor.color;
        ctx.font = '600 ' + editor.fontSize + 'px Roboto, "Segoe UI", Arial, sans-serif';
        ctx.textBaseline = 'top';
        ctx.fillText(text, editor.canvasX, editor.canvasY);
        ctx.restore();
        autosave();
      }
    }
    if (editor.element.parentElement) editor.element.parentElement.removeChild(editor.element);
  }

  function startTextInput(x, y, clientX, clientY) {
    closeTextEditor(false);

    var editor = document.createElement('div');
    editor.className = 'text-editor-overlay';
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'text-input-overlay';
    input.placeholder = 'Type a label';
    input.setAttribute('aria-label', 'Controller label text');
    input.autocomplete = 'off';
    input.spellcheck = true;
    input.style.color = state.color;

    var addButton = document.createElement('button');
    addButton.type = 'button';
    addButton.className = 'text-editor-action text-editor-add';
    addButton.textContent = 'Add text';

    var cancelButton = document.createElement('button');
    cancelButton.type = 'button';
    cancelButton.className = 'text-editor-action text-editor-cancel';
    cancelButton.textContent = 'Cancel';

    editor.appendChild(input);
    editor.appendChild(addButton);
    editor.appendChild(cancelButton);
    canvas.parentElement.appendChild(editor);

    var wrapRect = canvas.parentElement.getBoundingClientRect();
    var left = clientX - wrapRect.left;
    var top = clientY - wrapRect.top;
    var maxLeft = Math.max(4, wrapRect.width - editor.offsetWidth - 4);
    var maxTop = Math.max(4, wrapRect.height - editor.offsetHeight - 4);
    editor.style.left = Math.max(4, Math.min(left, maxLeft)) + 'px';
    editor.style.top = Math.max(4, Math.min(top, maxTop)) + 'px';

    state.textEditor = {
      element: editor,
      input: input,
      canvasX: x,
      canvasY: y,
      color: state.color,
      fontSize: Math.max(14, state.size * 3)
    };

    addButton.addEventListener('click', function () { closeTextEditor(true); });
    cancelButton.addEventListener('click', function () { closeTextEditor(false); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); closeTextEditor(true); }
      if (e.key === 'Escape') { e.preventDefault(); closeTextEditor(false); }
    });

    // Wait until the pointer event that created the editor has finished before
    // focusing it. This is reliable in both a normal tab and the lesson iframe.
    setTimeout(function () {
      if (state.textEditor && state.textEditor.input === input) input.focus();
    }, 0);
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = canvasPoint(e.clientX, e.clientY);
    if (state.tool === 'text') {
      e.preventDefault();
      startTextInput(p.x, p.y, e.clientX, e.clientY);
      return;
    }
    pushUndoSnapshot();
    state.drawing = true;
    state.lastX = p.x;
    state.lastY = p.y;
    // A single click/tap with no drag should still leave a dot.
    strokeTo(p.x + 0.01, p.y + 0.01);
    try { canvas.setPointerCapture(e.pointerId); } catch (_e) { /* pointer id not active, harmless */ }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!state.drawing) return;
    var p = canvasPoint(e.clientX, e.clientY);
    strokeTo(p.x, p.y);
  });
  function endStroke() {
    if (!state.drawing) return;
    state.drawing = false;
    autosave();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', function () { if (state.drawing) endStroke(); });

  loadAutosave();
})();
</script>
</body>
</html>
