<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PyScratch</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <iframe
      src="../scratch/editor.html?pyscratch=1&psv=20260826a"
      allow="microphone; camera"
      allowfullscreen
    ></iframe>
    <script>
      // Relay tutorial-completion messages from the editor iframe up to
      // whichever page embedded this one (the Bloomsbury Computing shell,
      // when run there) — same one-hop passthrough TurboBot/index.html
      // uses for PyBot's LEVEL_COMPLETE messages.
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (data && data.type === 'PS_TUTORIAL_COMPLETE' && window.parent !== window) {
          window.parent.postMessage(data, '*');
        }
      });
    </script>
  </body>
</html>
