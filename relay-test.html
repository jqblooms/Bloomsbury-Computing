<!DOCTYPE html>
<html><head><title>relay test</title></head>
<body style="margin:0">
<div id="log" style="position:fixed;top:0;left:0;background:#fff;padding:8px;font:12px monospace;z-index:9999"></div>
<iframe src="TurboBot/index.html" style="width:100%;height:100vh;border:0"></iframe>
<script>
window.addEventListener('message', function (e) {
  document.getElementById('log').textContent = 'received: ' + JSON.stringify(e.data) + ' from origin ' + e.origin;
});
</script>
</body></html>
