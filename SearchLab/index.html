<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Lab</title>
  <link rel="stylesheet" href="../shared/bc-theme.css?v=20260927s">
  <link rel="stylesheet" id="sl-css" href="lab.css">
</head>
<body>
<main>
  <section class="panel" id="activity" aria-live="polite"></section>
</main>
<script>
// Search Lab (Year 9, 2.4 Binary Search). ?activity= picks one task:
//   middle  binary search one check at a time: click the middle item, then say which part to keep (levels 1 to 4)
//   race    linear or binary: predict how many comparisons each search makes on the same list, then run both
// ?level= is the first level, ?upto= the last one the slide needs. ?embed=1 sits it on a lesson slide.
(function () {
  var params = new URLSearchParams(location.search);
  var v = params.get('bcv') || '1';
  if (params.get('embed') === '1') document.documentElement.classList.add('embed');
  document.getElementById('sl-css').href = 'lab.css?v=' + encodeURIComponent(v);
  var s = document.createElement('script');
  s.src = 'lab.js?v=' + encodeURIComponent(v);
  s.async = false;
  document.body.appendChild(s);
})();
</script>
<script src="../shared/bc-clicker.js?v=20260929c"></script>
</body>
</html>
