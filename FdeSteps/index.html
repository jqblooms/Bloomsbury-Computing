<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FDE Steps</title>
  <link rel="stylesheet" href="../shared/bc-theme.css?v=20260927s">
  <link rel="stylesheet" id="app-css" href="style.css">
</head>
<body>
<main></main>
<script>window.BC_CLOUD_SAVE = { app: 'fdesteps', keys: ['bc-fdesteps-v1'] };</script>
<script src="../shared/cloud-save.js?v=20261030"></script>
<script>
// FDE Steps (Year 10, the fetch-decode-execute cycle): five stages, one small question at a time, help that
// fades per question. 3 right in a row masters a question; questions never stop.
// ?embed=1 sits it on a lesson slide. Every file is loaded with the page's bcv. Logic test:
// node tools/test_fde_steps.mjs
(function () {
  var params = new URLSearchParams(location.search);
  var v = params.get('bcv') || '1';
  if (params.get('embed') === '1') document.documentElement.classList.add('embed');
  document.getElementById('app-css').href = 'style.css?v=' + encodeURIComponent(v);
  ['js/logic.js', 'js/fx.js', 'js/app.js'].forEach(function (file) {
    var s = document.createElement('script');
    s.src = file + '?v=' + encodeURIComponent(v);
    s.async = false;
    document.body.appendChild(s);
  });
})();
</script>
<script src="../shared/bc-clicker.js?v=20260929c"></script>
</body>
</html>
