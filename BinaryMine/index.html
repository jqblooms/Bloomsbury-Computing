<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Mine</title>
<link rel="stylesheet" href="../shared/bc-theme.css?v=20260927s">
<style>
  /* On the site's dark theme (shared/bc-theme.css). The ore colours are the
     game's art; everything else is the site's look (see the module). */
  :root {
    --panel: var(--surface);
    --border: var(--line);
    --accent: var(--brand);
    --text: var(--ink);
    --text-dim: var(--muted);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 1.3rem;
    color: var(--ink);
  }
  .intro-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    font-size: 0.9rem;
    max-width: 900px;
  }
  .intro-grid div span:first-child {
    display: block;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .intro-grid div span:last-child {
    color: var(--text);
    font-family: var(--font-mono);
  }
  #bmg-root {
    min-height: calc(100vh - 110px);
  }
</style>
</head>
<body>

<header>
  <h1>Binary Mine</h1>
  <div class="intro-grid">
    <div><span>Mine</span><span>Left-click a block</span></div>
    <div><span>Build</span><span>Right-click the sky</span></div>
    <div><span>Combine</span><span>0110 + 1100 = 10010</span></div>
    <div><span>Goal</span><span>Discover the highest element</span></div>
  </div>
</header>

<div id="bmg-root"></div>

<script>window.BC_CLOUD_SAVE = {"app":"binarymine","keys":["pylearn_mining_v1"]};</script>
<script src="../shared/cloud-save.js?v=20260926"></script>
<script src="../shared/bc-support.js?v=20260927"></script>
<script>document.write('<script src="binary-mining-module.js?v=' + encodeURIComponent(new URLSearchParams(location.search).get("bcv") || "") + '"><\/script>');</script>
<script>
  if (window.initBinaryMiningGame) {
    initBinaryMiningGame('bmg-root');
  } else {
    document.getElementById('bmg-root').innerHTML = '<p style="color:#f28b82;padding:20px">Game could not load. Please refresh the page.</p>';
  }
</script>

</body>
</html>
