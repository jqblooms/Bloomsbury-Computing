<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TurboBot</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <iframe
      id="tb-frame"
      src="../scratch/editor.html?turbobot=1&tbv=20260822q"
      allow="microphone; camera"
      allowfullscreen
    ></iframe>
    <script>
      // Relay level-completion messages from the TurboWarp/TurboBot iframe
      // up to whatever embeds this page (the Bloomsbury Computing app).
      window.addEventListener('message', function (event) {
        var frame = document.getElementById('tb-frame');
        if (!frame || event.source !== frame.contentWindow || !event.data) return;
        if (event.data.type !== 'LEVEL_COMPLETE') return;
        if (window.parent !== window) {
          window.parent.postMessage(event.data, '*');
        }
      });
    </script>
  </body>
</html>
