<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloomsbury Computing</title>
  <link rel="stylesheet" href="shared/bc-theme.css?v=20260927s">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
    main { max-width: 460px; text-align: center; }
    .mark { display: block; width: 64px; height: 64px; margin: 0 auto 16px; object-fit: contain; }
    h1 { margin: 0 0 24px; font-size: 26px; }
    .bc-btn { min-height: 44px; padding: 0 24px; font-size: 15px; }
    body.is-framed { display: block; padding: 0; }
    .site-frame { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  </style>
</head>
<body>
  <main id="landing">
    <img class="mark" src="assets/img/bish-crest.png?v=1" alt="">
    <h1>Bloomsbury Computing</h1>
    <a class="bc-btn" id="open-site" href="https://script.google.com/macros/s/AKfycbxleLXeE1NupxyQpqFtpyVq5DX5sXnbZnxWvmbQz5qUcuHXN5eQu5fRanXcqhNO6WzQ7Q/exec">Open Bloomsbury Computing</a>
  </main>
  <script>
    // Phones and Chromebooks share the device's Google sign-in with the
    // browser, and Google then refuses the direct link ("Sorry, unable to
    // open the file at present"). There the site opens inside this page
    // instead (Code.gs doGet ?frame=1). Google sees no account in a frame,
    // exactly as in incognito, so the site works and shows its sign-in
    // popup. Desktops follow the direct link and sign in as normal.
    // pointer: coarse still catches a phone in "Desktop site" mode.
    (function () {
      var link = document.getElementById('open-site');
      var ua = navigator.userAgent || '';
      var phoneOrChromebook = /Android|CrOS|iPhone|iPad|iPod/i.test(ua) ||
        !!(navigator.userAgentData && navigator.userAgentData.mobile) ||
        (window.matchMedia && matchMedia('(pointer: coarse)').matches);
      if (!phoneOrChromebook) return;
      link.addEventListener('click', function (e) {
        e.preventDefault();
        var frame = document.createElement('iframe');
        frame.className = 'site-frame';
        frame.title = 'Bloomsbury Computing';
        frame.setAttribute('credentialless', '');
        frame.allow = 'fullscreen; clipboard-read; clipboard-write';
        frame.src = link.href + '?frame=1' + location.hash;
        document.getElementById('landing').remove();
        document.body.classList.add('is-framed');
        document.body.appendChild(frame);
      });
    })();
  </script>
</body>
</html>
