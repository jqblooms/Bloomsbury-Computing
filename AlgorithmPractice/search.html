<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Searching Algorithms Practice</title>
  <link rel="stylesheet" href="../shared/bc-theme.css?v=20260927s">
  <script>document.write('<link rel="stylesheet" href="style.css?v=' + encodeURIComponent(new URLSearchParams(location.search).get("bcv") || "") + '">');</script>
  <script src="../shared/bc-support.js?v=20260927"></script>
</head>
<body>
  <div class="ap">
    <header class="ap-head">
      <div class="ap-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/><path d="M8.5 11h5"/></svg>
        <div>
          <h1>Searching Algorithms Practice</h1>
          <p>Find the target by checking the boxes in the order the algorithm would.</p>
        </div>
      </div>
      <div class="ap-head-tools" id="support-slot"></div>
    </header>

    <div class="ap-tabs" role="tablist" aria-label="Algorithm">
      <button type="button" class="ap-tab is-active" role="tab" aria-selected="true" data-algo="linear">Linear search</button>
      <button type="button" class="ap-tab" role="tab" aria-selected="false" data-algo="binary">Binary search</button>
    </div>

    <div class="ap-controls">
      <label for="size">List size</label>
      <select id="size">
        <option value="7">7 items</option>
        <option value="11" selected>11 items</option>
        <option value="15">15 items</option>
        <option value="21">21 items</option>
      </select>
      <button type="button" class="bc-btn" id="new-random">New list</button>
      <span class="spacer"></span>
      <button type="button" class="bc-btn is-outline" id="new-best">Best case</button>
      <button type="button" class="bc-btn is-outline" id="new-worst">Worst case</button>
      <button type="button" class="bc-btn is-outline" id="new-missing">Not in the list</button>
    </div>

    <div class="ap-main">
      <div class="ap-col">
        <section class="bc-card ap-card">
          <div class="ap-task" id="task"></div>
          <div class="ap-target">Target <b id="target">?</b></div>
        </section>
        <section class="bc-card ap-board">
          <div class="ap-row" id="row"></div>
          <div class="ap-feedback" id="feedback" aria-live="polite" style="margin-top:16px"></div>
          <div class="ap-hint" id="hint" aria-live="polite"></div>
          <div class="ap-done" id="done"></div>
        </section>
      </div>
      <div class="ap-col">
        <section class="bc-card ap-card">
          <h2>The algorithm</h2>
          <pre class="ap-code" id="code"></pre>
          <p class="ap-note" id="code-note"></p>
        </section>
        <section class="bc-card ap-card">
          <h2>Trace table</h2>
          <div class="ap-stats" id="stats"></div>
          <div class="ap-trace-wrap" id="trace"></div>
        </section>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var v = encodeURIComponent(new URLSearchParams(location.search).get("bcv") || "");
      ["common.js", "search.js"].forEach(function (file) {
        document.write('<script src="' + file + "?v=" + v + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
