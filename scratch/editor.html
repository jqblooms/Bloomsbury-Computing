    <style>
      /* Prevent the Scratch editor document from ever generating scrollbars when
         embedded in an iframe (the parent letterboxes it to fit the available space). */
      html, body { overflow: hidden; margin: 0; }
      .splash-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .splash-screen[hidden] {
        display: none;
      }
      .splash-screen[data-theme="dark"] {
        background-color: #333;
        color: white;
      }
      .splash-screen > * {
        max-width: 80%;
      }
      .splash-spinner:after {
        content: " ";
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 6px solid;
        border-color: currentColor transparent currentColor transparent;
        animation: splash-spinner 1.2s linear infinite;
      }
      @keyframes splash-spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .splash-error-title {
        font-weight: bold;
      }
      .splash-error-title a {
        color: inherit;
      }
      .splash-errors {
        font-family: monospace;
      }
      .splash-error-list {
        white-space: pre-wrap;
      }
      .splash-reset {
        color: inherit;
        background: none;
        padding: 0;
        margin: 0;
        border: none;
        text-decoration: underline;
        cursor: pointer;
      }
      .splash-reset:disabled {
        opacity: 0.8;
      }
    </style>
  </head>

      <div class="splash-error-title" hidden>Something went wrong. <a href="https://scratch.mit.edu/users/GarboMuffin/#comments" target="_blank" rel="noreferrer">Please report</a> with the information below.</div>
      <div class="splash-errors" hidden></div>
      <button class="splash-reset" hidden>Click here to reset caches (can fix some errors)</button>
    </div>

    <script>
      (function () {
        'use strict';

        try {
          Object.defineProperty(window, 'onbeforeunload', {
            configurable: true,
            get: function () {
              return null;
            },
            set: function () {
              return true;
            }
          });
        } catch (e) {
          window.onbeforeunload = null;
        }
        window.addEventListener('beforeunload', function (e) {
          e.stopImmediatePropagation();
          delete e.returnValue;
        }, true);

        // Bloomsbury Computing: the site is dark, so the editor starts dark
        // with a blue accent, unless the student has picked a theme already.
        try {
          if (!localStorage.getItem('tw:theme')) localStorage.setItem('tw:theme', JSON.stringify({ accent: 'blue', gui: 'dark' }));
        } catch (e) {
          // storage blocked: the editor falls back to the system setting
        }

        var theme = '';
        var accent = '#ff4c4c';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            if (parsed.accent === 'purple') {
              accent = '#855cd6';
            } else if (parsed.accent === 'blue') {
              accent = '#4c97ff';
            }
            if (parsed.gui === 'dark' || parsed.gui === 'light') {
              theme = parsed.gui;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var splash = document.querySelector('.spash-waiting-for-js');
        splash.setAttribute('data-theme', theme);
        if (theme !== 'dark') {
          
            splash.style.backgroundColor = accent;
            splash.style.color = 'white';
          
        }
        splash.hidden = false;

        var splashErrorTitle = document.querySelector('.splash-error-title');
        var splashError = document.querySelector('.splash-errors');
        var splashReset = document.querySelector('.splash-reset');

        var totalErrors = 0;
        window.onerror = function (event, source, line, col, err) {
          if (++totalErrors > 5) return; // dont bother logging more
          splashErrorTitle.hidden = splashError.hidden = splashReset.hidden = false;
          var el = document.createElement('div');
          el.textContent = 'Error (splash) in ' + source + ' (' + line + ':' + col + '): ' + err;
          splashError.appendChild(el);
        };

        splashReset.onclick = function () {
          splashReset.disabled = true;
          function hardRefresh() {
            var search = location.search.replace(/[?&]nocache=[\d.]+(?=$|&)/, '');
            // This is a functional cookie used so that we respond with Clear-Site-Data just once. No tracking.
            // Can't use nocache parameter to trigger this because people might accidentally bookmark that, and
            // then we would be clearing their cache on every visit.
            document.cookie = 'tw_clear_cache_once=1; max-age=60; path=/; samesite=strict; secure';
            location.replace(location.pathname + search + (search ? '&' : '?') + 'nocache=' + Math.floor(Math.random() * 10000000));
          }
          if ('serviceWorker' in navigator) {
            setTimeout(hardRefresh, 5000);
            navigator.serviceWorker.getRegistration("")
              .then(function(registration) {
                if (registration) {
                  return registration.unregister();
                }
              })
              .then(hardRefresh)
              .catch(hardRefresh);
          } else {
            hardRefresh();
          }
        };

        window.SplashEnd = () => {
          splash.hidden = true;
          window.onerror = null;
        };
      })();
    </script>

  <script>
    // editor.js checks `typeof showSaveFilePicker === 'function'` (and the
    // same for showOpenFilePicker) once, when it first evaluates its
    // defaultProps, and uses the File System Access API for Save/Load
    // whenever that check passes. Chrome refuses to grant that API inside a
    // cross-origin iframe at all (a hard security restriction with no
    // Permissions-Policy opt-in - it exists specifically to stop a framed
    // page from being tricked into picking a sensitive local file), so the
    // check still passes here, but every call then fails, breaking Save and
    // Load for any framed visitor on a browser that has the API - most of
    // them, since Firefox and Safari never had it and already use the
    // working fallback (classic <input type=file>, and a download-Blob
    // save) that editor.js falls back to when the check is false. Deleting
    // both globals before editor.js loads makes it take that same working
    // fallback here too. Guarded to framed visits only - loading this page
    // directly, at the top level, should still get the native picker.
    if (window.top !== window.self) {
      try {
        delete window.showSaveFilePicker;
        delete window.showOpenFilePicker;
      } catch (e) {
        window.showSaveFilePicker = undefined;
        window.showOpenFilePicker = undefined;
      }
    }
  </script>

  <script>
    // Rare bug James diagnosed: a block's puzzle-piece shape is sized from
    // its label text's measured width (getComputedTextLength on the SVG
    // <text> node) at the moment the block first renders. If that
    // measurement happens before the page's fonts and layout have fully
    // settled, the shape gets sized for a narrower rendering than what
    // actually ends up painted, so the label text overflows or sits wrong
    // inside a shape that's already too small - and nothing re-measures it
    // afterwards, since scratch-blocks only sizes a block on its own
    // render() call, not automatically on a later font swap.
    // window.ScratchBlocks is set once the Blocks React component mounts
    // (editor.js), which can happen slightly before or after this script
    // runs, so poll for it rather than assuming order. Once fonts report
    // ready (document.fonts.ready - resolves immediately if none are still
    // loading, so this is a no-op on every normal load) and a couple of
    // animation frames have let layout settle, force every existing block
    // to re-render, which re-measures its text and resizes its shape to
    // match - the same fix pattern used for this exact class of Blockly bug
    // (stale shape size after a font/layout race) elsewhere.
    (function () {
      var findAttempts = 0;
      function rerenderAllBlocks(workspace) {
        try {
          workspace.getAllBlocks(false).forEach(function (block) {
            if (block.rendered) block.render();
          });
        } catch (e) {
          // Best-effort only - never break the editor over this.
        }
      }
      function findWorkspace() {
        findAttempts++;
        var ScratchBlocks = window.ScratchBlocks;
        var workspace = ScratchBlocks && ScratchBlocks.getMainWorkspace && ScratchBlocks.getMainWorkspace();
        if (!workspace) {
          if (findAttempts < 100) setTimeout(findWorkspace, 100);
          return;
        }
        var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
        fontsReady.then(function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              // The workspace can exist before the project actually being
              // opened (the default project, or one a student is loading)
              // has finished populating it with blocks - a single pass here
              // could run before any of those blocks exist yet. Repeat a
              // few times over the next few seconds to also catch that
              // case; re-rendering an already-correct block is harmless.
              rerenderAllBlocks(workspace);
              [500, 1500, 3000].forEach(function (delay) {
                setTimeout(function () { rerenderAllBlocks(workspace); }, delay);
              });
            });
          });
        });
      }
      findWorkspace();
    })();
  </script>
