<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pseudocode Recap</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="style.css?v=' + encodeURIComponent(new URLSearchParams(location.search).get("bcv") || "") + '">');</script>
</head>
<body>
<header class="top">
  <div>
    <h1>Pseudocode Recap</h1>
    <div class="kicker">Year 11, Unit 7 · Cambridge IGCSE 0478 pseudocode</div>
  </div>
  <div class="prog"><span id="progText">0 tasks done</span><div class="bar"><span id="progBar"></span></div></div>
</header>
<div class="layout">
  <nav class="topics" id="nav" aria-label="Topics"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<footer>Bloomsbury Computing. Cambridge IGCSE 0478 house style: DECLARE every variable, THEN on its own line, NEXT names its loop variable.</footer>

<script>
  // Loads the Cambridge pseudocode interpreter (window.CIE), the recap
  // topics and tasks (window.RECAP_TOPICS), then the page itself. Every file
  // carries this page's bcv, so a new GH_PAGES_BUILD from the shell
  // refreshes them together.
  (function () {
    var v = encodeURIComponent(new URLSearchParams(location.search).get("bcv") || "");
    ["js/interpreter.js", "js/topics.js", "js/app.js"].forEach(function (file) {
      document.write('<script src="' + file + "?v=" + v + '"><\/script>');
    });
  })();
</script>
</body>
</html>
