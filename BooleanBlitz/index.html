<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boolean Blitz</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        body { font-family: 'JetBrains Mono', monospace; overflow: hidden; touch-action: manipulation; background-color: #0f172a; }
        #root { height: 100%; width: 100%; }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%,90%{transform:translate3d(-1px,0,0)} 20%,80%{transform:translate3d(2px,0,0)} 30%,50%,70%{transform:translate3d(-4px,0,0)} 40%,60%{transform:translate3d(4px,0,0)} }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .custom-scrollbar { scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.3) rgba(255,255,255,.1); }
        .custom-scrollbar::-webkit-scrollbar{width:6px}
        .custom-scrollbar::-webkit-scrollbar-track{background:rgba(255,255,255,.1)}
        .custom-scrollbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}
        .no-select{user-select:none;-webkit-user-select:none}
        .backdrop-blur-md{backdrop-filter:blur(12px)}
    </style>
</head>
<body class="text-white h-screen w-screen overflow-hidden">
<div id="root"></div>

<script>
// Bloomsbury Computing identity bridge: when embedded in the main site,
// the parent posts the signed-in user's display name here instead of
// this game asking for one itself. Same contract as Binary Blitz's own
// bridge (and every other embedded app's).
window.__bcPlayerName = null;
window.addEventListener('message', function (event) {
  var data = event.data;
  if (data && data.type === 'BC_IDENTITY' && data.name) {
    window.__bcPlayerName = data.name;
  }
});

// Report progress up to the parent (which persists it to the Progress
// sheet) so students never have to manually export anything; a teacher
// sees it live in the admin dashboard instead. Message type is
// BLB_PROGRESS (Boolean bLitz), the sibling of Binary Blitz's own
// BB_PROGRESS - same shape, different type string, so the parent can
// tell the two games apart.
window.postToParent = function (payload) {
  if (window.parent !== window) {
    window.parent.postMessage(payload, '*');
  }
};
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// --- CONSTANTS ---
const BASE_DURATION_REF = 30000;

const LEVELS = {
    1: { title: "AND, OR, NOT", color: "blue", desc: "Toggle the inputs, submit the result." },
    2: { title: "Truth Table Fill", color: "red", desc: "Complete the missing values." },
    3: { title: "Comparisons", color: "emerald", desc: "True or False?" },
    4: { title: "Compound Conditions", color: "purple", desc: "Combine AND and OR." },
    5: { title: "NAND, NOR, XOR", color: "pink", desc: "Three more logic gates." },
    6: { title: "Match the Symbol", color: "orange", desc: "Pick the right gate." },
    7: { title: "Final Exam", color: "rose", desc: "15 Questions. No Timer." }
};

const GATES = ['AND', 'OR', 'NOT'];
const EXT_GATES = ['NAND', 'NOR', 'XOR'];
const ALL_GATES = GATES.concat(EXT_GATES);
const GATE_SYMBOLS = { AND: '∧', OR: '∨', NOT: '¬', NAND: '⊼', NOR: '⊽', XOR: '⊕' };
const GATE_DESCRIPTIONS = {
    AND: 'True only when every input is True',
    OR: 'True when at least one input is True',
    NOT: 'Flips True to False, and False to True',
    NAND: 'True unless every input is True',
    NOR: 'True only when every input is False',
    XOR: 'True when the inputs are different'
};
// text(g) builds the display string using g(gateName) so AND/OR/NOT
// swap case with the Python toggle just like everywhere else - g is
// supplied at render time, not stored, so a mid-question toggle flip
// updates the text immediately without regenerating the question.
const COMPOUND_TEMPLATES = [
    { text: (g) => `A ${g('AND')} B, ${g('OR')} C`, calc: (a, b, c) => (a && b) || c },
    { text: (g) => `A ${g('OR')} B, ${g('AND')} C`, calc: (a, b, c) => (a || b) && c },
    { text: (g) => `${g('NOT')} A, ${g('AND')} B`, calc: (a, b, c) => (!a) && b },
    { text: (g) => `A ${g('AND')} (B ${g('OR')} C)`, calc: (a, b, c) => a && (b || c) },
    { text: (g) => `A ${g('OR')} (B ${g('AND')} C)`, calc: (a, b, c) => a || (b && c) }
];

const levelTitleSizeClass = (title) => {
    if (title.length > 24) return 'text-base';
    return 'text-lg';
};

// --- UTILS ---
const evalGate = (gate, a, b) => {
    switch (gate) {
        case 'AND': return a && b;
        case 'OR': return a || b;
        case 'NOT': return !a;
        case 'NAND': return !(a && b);
        case 'NOR': return !(a || b);
        case 'XOR': return a !== b;
        default: return false;
    }
};
const randBit = () => Math.random() < 0.5 ? 0 : 1;

// Cambridge International pseudocode is the default notation (=, <>,
// AND/OR/NOT), with a Python toggle on the main menu swapping in ==, !=
// and lowercase and/or/not - the only two operators that actually differ
// in spelling between the two. NAND/NOR/XOR (Level 5) are circuit gate
// names, not a pseudocode or Python keyword either way, so the toggle
// deliberately leaves them untouched rather than inventing a fake
// "Python NAND". The underlying question values never change, only how
// the operator/gate is displayed - generateQuestion always stores the
// canonical token (==, !=, AND, OR, NOT), these two helpers translate it
// at render time.
const opDisplay = (op, isPythonMode) => {
    if (op === '==') return isPythonMode ? '==' : '=';
    if (op === '!=') return isPythonMode ? '!=' : '<>';
    return op;
};
const gateDisplay = (gate, isPythonMode, isHardMode) => {
    if (isHardMode) return GATE_SYMBOLS[gate];
    if (isPythonMode && GATES.includes(gate)) return gate.toLowerCase();
    return gate;
};

const calculateMaxTime = (currentScore, isHardMode, multiplier = 1) => {
    const steps = Math.floor(currentScore / 250);
    const speedPercent = Math.min(120, 10 + (steps * 10));
    let duration = (BASE_DURATION_REF * 100) / speedPercent;
    if (isHardMode) duration = duration / 2.5;
    return duration * multiplier;
};

const generateQuestion = (level, isHardMode) => {
    if (level === 1) {
        const gate = GATES[Math.floor(Math.random() * GATES.length)];
        const a = randBit();
        const b = gate === 'NOT' ? null : randBit();
        const result = evalGate(gate, !!a, !!b) ? 1 : 0;
        return { gate, a, b, result };
    }
    if (level === 2) {
        const gate = GATES[Math.floor(Math.random() * GATES.length)];
        const pairs = gate === 'NOT' ? [[0, null], [1, null]] : [[0, 0], [0, 1], [1, 0], [1, 1]];
        const rows = pairs.map(([a, b]) => ({ a, b, result: evalGate(gate, !!a, !!b) ? 1 : 0 }));
        const hiddenCount = isHardMode ? rows.length : Math.max(1, Math.ceil(rows.length / 2));
        const hiddenIndices = rows.map((_, i) => i).sort(() => 0.5 - Math.random()).slice(0, hiddenCount).sort((a, b) => a - b);
        return { gate, rows, hiddenIndices };
    }
    if (level === 3) {
        const max = isHardMode ? 99 : 20;
        const a = Math.floor(Math.random() * max);
        const b = Math.floor(Math.random() * max);
        const ops = ['<', '>', '==', '!='];
        const op = ops[Math.floor(Math.random() * ops.length)];
        let result;
        if (op === '<') result = a < b;
        else if (op === '>') result = a > b;
        else if (op === '==') result = a === b;
        else result = a !== b;
        return { a, b, op, result };
    }
    if (level === 4) {
        const template = COMPOUND_TEMPLATES[Math.floor(Math.random() * COMPOUND_TEMPLATES.length)];
        const a = randBit(), b = randBit(), c = randBit();
        const result = template.calc(!!a, !!b, !!c) ? 1 : 0;
        return { template, a, b, c, result };
    }
    if (level === 5) {
        const gate = EXT_GATES[Math.floor(Math.random() * EXT_GATES.length)];
        const a = randBit(), b = randBit();
        const result = evalGate(gate, !!a, !!b) ? 1 : 0;
        return { gate, a, b, result };
    }
    if (level === 6) {
        const gate = ALL_GATES[Math.floor(Math.random() * ALL_GATES.length)];
        const options = ALL_GATES.slice().sort(() => 0.5 - Math.random());
        return { gate, description: GATE_DESCRIPTIONS[gate], options };
    }
    return null;
};

const saveScore = (score, level) => {
    const key = `booleanBlitz_scores_lvl${level}`;
    const stored = JSON.parse(localStorage.getItem(key) || '[]');
    stored.push({ score, date: new Date().toISOString() });
    stored.sort((a, b) => b.score - a.score);
    localStorage.setItem(key, JSON.stringify(stored.slice(0, 5)));
};
const saveExamResult = (score, total, time) => {
    const key = 'booleanBlitz_exam_history';
    const stored = JSON.parse(localStorage.getItem(key) || '[]');
    stored.push({ score, total, time, date: new Date().toISOString() });
    if (stored.length > 10) stored.shift();
    localStorage.setItem(key, JSON.stringify(stored));
};
const getScores = (level) => JSON.parse(localStorage.getItem(`booleanBlitz_scores_lvl${level}`) || '[]');
const getExamHistory = () => JSON.parse(localStorage.getItem('booleanBlitz_exam_history') || '[]');
const formatTime = (ms) => {
    const seconds = Math.floor(ms / 1000);
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}m ${s}s`;
};

// --- GAME LOOP (identical mechanic to Binary Blitz: score drives speed,
// speed drives how fast the stress bar fills, hard mode halves the time
// available on top of that) ---
const useGameLoop = (active, onGameOver, isHardMode, timeMultiplier = 1) => {
    const [stress, setStress] = useState(0);
    const [score, setScore] = useState(0);
    const [gameSpeed, setGameSpeed] = useState(10);
    const stressRef = useRef(0);
    const scoreRef = useRef(0);
    const maxTimeRef = useRef(calculateMaxTime(0, isHardMode, timeMultiplier));
    const lastTimeRef = useRef(Date.now());
    const frameRef = useRef();
    const resetRound = useCallback((pointsToAdd = 0) => {
        const newScore = scoreRef.current + pointsToAdd;
        scoreRef.current = newScore;
        setScore(newScore);
        const newStress = Math.max(0, stressRef.current - 0.3);
        stressRef.current = newStress;
        setStress(newStress);
        maxTimeRef.current = calculateMaxTime(newScore, isHardMode, timeMultiplier);
        const steps = Math.floor(newScore / 250);
        setGameSpeed(Math.min(120, 10 + (steps * 10)));
    }, [isHardMode, timeMultiplier]);
    useEffect(() => {
        if (!active) { cancelAnimationFrame(frameRef.current); return; }
        lastTimeRef.current = Date.now();
        const loop = () => {
            const now = Date.now();
            const delta = now - lastTimeRef.current;
            lastTimeRef.current = now;
            const increase = delta / maxTimeRef.current;
            stressRef.current += increase;
            if (stressRef.current >= 1) {
                stressRef.current = 1; setStress(1); cancelAnimationFrame(frameRef.current); onGameOver(scoreRef.current); return;
            }
            setStress(stressRef.current);
            frameRef.current = requestAnimationFrame(loop);
        };
        frameRef.current = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(frameRef.current);
    }, [active, onGameOver]);
    const addStress = useCallback((amount) => { stressRef.current = Math.min(0.99, stressRef.current + amount); setStress(stressRef.current); }, []);
    return { stress, score, resetRound, addStress, gameSpeed };
};

// --- SHARED COMPONENTS ---
const Button = ({ onClick, children, className = "", disabled = false, variant = "primary" }) => {
    const base = "font-bold py-3 px-6 rounded-lg shadow-lg transform transition-all active:scale-95 no-select flex items-center justify-center";
    const variants = { primary: "bg-violet-600 hover:bg-violet-500 text-white shadow-violet-900/50", secondary: "bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600", success: "bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/50", danger: "bg-red-600 hover:bg-red-500 text-white shadow-red-900/50" };
    return <button type="button" onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}>{children}</button>;
};

const Toggle = ({ checked, onChange, label }) => (
    <div className="flex items-center justify-center mb-6 cursor-pointer" onClick={() => onChange(!checked)}>
        <span className={`mr-3 font-bold text-sm ${checked ? 'text-red-400' : 'text-slate-400'}`}>{label}</span>
        <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
            <div className={`w-12 h-6 rounded-full shadow-inner transition-colors duration-200 ${checked ? 'bg-red-900' : 'bg-slate-700'}`}></div>
            <div className={`absolute w-6 h-6 rounded-full shadow inset-y-0 left-0 transition-transform duration-200 ease-in-out ${checked ? 'translate-x-6 bg-red-500' : 'translate-x-0 bg-slate-400'}`}></div>
        </div>
    </div>
);

// A single 0/1 input box. Not editable by keyboard on purpose - every
// answer in this game is a click, matching the "students clicking
// boxes" brief, no numpad needed anywhere.
const BitBox = ({ value, onClick, label, disabled }) => (
    <div className="flex flex-col items-center gap-2">
        {label && <div className="text-xs text-slate-400 font-bold">{label}</div>}
        <button type="button" onClick={onClick} disabled={disabled} className={`w-16 h-16 rounded-lg font-bold text-3xl transition-all active:scale-95 ${disabled ? 'opacity-30 cursor-not-allowed bg-slate-800 text-slate-600' : value ? 'bg-violet-600 text-white' : 'bg-slate-700 text-slate-400'}`}>{value}</button>
    </div>
);

const HelpModal = ({ levelId, onClose }) => {
    const content = {
        1: { title: "AND, OR, NOT", body: "Click the input boxes to set them to 0 or 1. Then click 0 or 1 below to submit the result of the gate shown.\nAND is 1 only when both inputs are 1.\nOR is 1 when at least one input is 1.\nNOT flips a single input." },
        2: { title: "Truth Table Fill", body: "A and B are already set. Click the highlighted result boxes to toggle them between 0 and 1 until every row is correct - the table checks itself as you go." },
        3: { title: "Comparisons", body: "Read the expression (like 5 == 2, or 10 > 3) and click True or False." },
        4: { title: "Compound Conditions", body: "Three inputs, A, B and C, combined with AND and OR. Work out the whole expression, then submit 0 or 1." },
        5: { title: "NAND, NOR, XOR", body: "Three more gates.\nNAND is NOT AND: 0 only when both inputs are 1.\nNOR is NOT OR: 1 only when both inputs are 0.\nXOR is 1 only when the two inputs are different." },
        6: { title: "Match the Symbol", body: "Read the description, then click the gate it describes." },
        7: { title: "Final Exam", body: "15 questions mixed from every level above.\nNo time limit for Game Over, but time is tracked.\nTry to beat your previous score!" }
    };
    const data = content[levelId] || { title: "Help", body: "Good luck!" };
    return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4 fade-in" onClick={onClose}>
            <div className="bg-slate-800 border border-slate-600 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                <h2 className="text-2xl font-bold text-white mb-4 leading-tight">{data.title}</h2>
                <p className="text-slate-300 whitespace-pre-wrap leading-relaxed">{data.body}</p>
                <Button onClick={onClose} className="w-full mt-6">Close</Button>
            </div>
        </div>
    );
};

const GameLayout = ({ stress, score, gameSpeed, onExit, onHelp, levelName, children, isHardMode }) => {
    const bgOpacity = Math.min(0.7, stress);
    const barWidth = Math.max(0, (1 - stress) * 100);
    return (
        <div className={`h-full flex flex-col p-4 relative transition-colors duration-100 ${stress > 0.85 ? 'shake' : ''}`} style={{ backgroundColor: `rgba(76, 29, 149, ${bgOpacity})` }}>
            <div className="flex justify-between items-center mb-4 z-10 shrink-0">
                <button onClick={onExit} className="p-2 bg-slate-900/50 hover:bg-slate-800 rounded-full text-white backdrop-blur-sm"><svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg></button>
                <div className="flex flex-col items-center">
                    <span className={`text-xs font-bold tracking-widest uppercase mb-1 text-center leading-tight max-w-[38vw] ${isHardMode ? 'text-red-400' : 'text-slate-300'}`}>{levelName} {isHardMode && '★'}</span>
                    <div className={`bg-slate-900/90 px-6 py-1 rounded-full border shadow-lg ${isHardMode ? 'border-red-500/50' : 'border-violet-500/30'}`}><span className="text-xl font-mono text-white font-bold">{score}</span></div>
                </div>
                <div className="flex flex-col items-end gap-1">
                    <span className="text-[10px] text-slate-400 font-bold uppercase">SPEED</span>
                    <span className={`text-xl font-bold font-mono ${gameSpeed > 100 || isHardMode ? 'text-red-400 animate-pulse' : 'text-violet-400'}`}>{gameSpeed}%</span>
                    <button onClick={onHelp} className="mt-1 text-xs bg-slate-700 hover:bg-white hover:text-black rounded-full w-6 h-6 flex items-center justify-center font-bold transition-colors" title="Level Help">?</button>
                </div>
            </div>
            <div className="w-full h-2 bg-slate-900/50 rounded-full mb-4 overflow-hidden z-10 shrink-0"><div className={`h-full transition-all duration-100 ${stress > 0.7 ? 'bg-red-500' : 'bg-violet-500'}`} style={{ width: `${barWidth}%` }}></div></div>
            <div className="flex-1 z-10 flex flex-col items-center min-h-0 w-full max-w-4xl mx-auto overflow-y-auto custom-scrollbar pb-20">{children}</div>
        </div>
    );
};

const ExamLayout = ({ currentQ, totalQ, onExit, children }) => (
    <div className="h-full flex flex-col p-4 bg-slate-900 relative">
        <div className="flex justify-between items-center mb-6 z-10 shrink-0">
            <button onClick={onExit} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full text-white"><svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg></button>
            <div className="text-xl font-bold text-rose-400 tracking-widest">FINAL EXAM</div>
            <div className="bg-slate-800 px-4 py-1 rounded-full border border-rose-500/30"><span className="text-white font-mono">Q: {currentQ} / {totalQ}</span></div>
        </div>
        <div className="w-full h-2 bg-slate-800 rounded-full mb-8 overflow-hidden"><div className="h-full bg-rose-500 transition-all duration-300" style={{ width: `${(currentQ / totalQ) * 100}%` }}></div></div>
        <div className="flex-1 z-10 flex flex-col items-center min-h-0 w-full max-w-4xl mx-auto overflow-y-auto custom-scrollbar pb-20">{children}</div>
    </div>
);

// --- GENERIC LEVEL LOGIC (levels 1, 3, 4, 5 share one shape: a question
// object, a fixed set of click targets, one of which is correct) ---
const GenericLevel = ({ level, onExit, onGameOver, isHardMode, isPythonMode, onHelp }) => {
    const startTimeRef = useRef(Date.now()); const correctRef = useRef(0); const wrongRef = useRef(0);
    const handleGameEnd = useCallback((s) => onGameOver(s, level, Date.now() - startTimeRef.current, correctRef.current, wrongRef.current), [onGameOver, level]);
    const handleExit = () => onExit(level, Date.now() - startTimeRef.current, correctRef.current, wrongRef.current, score);
    const { stress, score, resetRound, addStress, gameSpeed } = useGameLoop(true, handleGameEnd, isHardMode);
    const [question, setQuestion] = useState(null);
    const [inputs, setInputs] = useState({});
    const [shake, setShake] = useState(false);
    useEffect(() => { nextQuestion(); }, [level]);
    const nextQuestion = (points = 0) => {
        setQuestion(generateQuestion(level, isHardMode));
        setInputs({});
        resetRound(isHardMode ? Math.floor(points * 2.5) : points);
    };
    const toggleInput = (key) => setInputs(prev => ({ ...prev, [key]: prev[key] ? 0 : 1 }));
    const submit = (value) => {
        if (!question) return;
        const correct = value === question.result;
        if (correct) { correctRef.current += 1; setTimeout(() => nextQuestion(100), 200); }
        else { wrongRef.current += 1; setShake(true); setTimeout(() => setShake(false), 500); addStress(0.2); }
    };
    const submitBool = (bool) => {
        if (!question) return;
        const correct = bool === question.result;
        if (correct) { correctRef.current += 1; setTimeout(() => nextQuestion(100), 200); }
        else { wrongRef.current += 1; setShake(true); setTimeout(() => setShake(false), 500); addStress(0.2); }
    };
    if (!question) return null;

    if (level === 1) {
        const a = inputs.a !== undefined ? inputs.a : question.a;
        const b = inputs.b !== undefined ? inputs.b : question.b;
        const gateLabel = gateDisplay(question.gate, isPythonMode, isHardMode);
        return (
            <GameLayout stress={stress} score={score} gameSpeed={gameSpeed} onExit={handleExit} onHelp={onHelp} levelName="L1: AND, OR, NOT" isHardMode={isHardMode}>
                <div className="text-center mb-8"><div className="text-slate-400 text-sm mb-2">GATE</div><div className="text-6xl font-bold font-mono text-violet-300">{gateLabel}</div></div>
                <div className={`flex gap-6 mb-10 ${shake ? 'shake' : ''}`}>
                    <BitBox value={a} label="A" onClick={() => toggleInput('a')} />
                    {question.gate !== 'NOT' && <BitBox value={b} label="B" onClick={() => toggleInput('b')} />}
                </div>
                <div className="text-slate-400 text-sm mb-3">RESULT</div>
                <div className="flex gap-6">
                    <button type="button" onClick={() => submit(0)} className="w-20 h-20 rounded-lg font-bold text-3xl bg-slate-700 hover:bg-slate-600 text-white active:scale-95">0</button>
                    <button type="button" onClick={() => submit(1)} className="w-20 h-20 rounded-lg font-bold text-3xl bg-slate-700 hover:bg-slate-600 text-white active:scale-95">1</button>
                </div>
            </GameLayout>
        );
    }
    if (level === 3) {
        return (
            <GameLayout stress={stress} score={score} gameSpeed={gameSpeed} onExit={handleExit} onHelp={onHelp} levelName="L3: Comparisons" isHardMode={isHardMode}>
                <div className={`text-center mb-10 ${shake ? 'shake' : ''}`}><div className="text-slate-400 text-sm mb-2">TRUE OR FALSE?</div><div className="text-6xl font-bold font-mono text-emerald-300">{question.a} {opDisplay(question.op, isPythonMode)} {question.b}</div></div>
                <div className="flex gap-6">
                    <Button onClick={() => submitBool(false)} variant="danger" className="w-32 h-16 text-xl">FALSE</Button>
                    <Button onClick={() => submitBool(true)} variant="success" className="w-32 h-16 text-xl">TRUE</Button>
                </div>
            </GameLayout>
        );
    }
    if (level === 4) {
        const a = inputs.a !== undefined ? inputs.a : question.a;
        const b = inputs.b !== undefined ? inputs.b : question.b;
        const c = inputs.c !== undefined ? inputs.c : question.c;
        return (
            <GameLayout stress={stress} score={score} gameSpeed={gameSpeed} onExit={handleExit} onHelp={onHelp} levelName="L4: Compound Conditions" isHardMode={isHardMode}>
                <div className="text-center mb-8"><div className="text-slate-400 text-sm mb-2">EXPRESSION</div><div className="text-3xl md:text-4xl font-bold font-mono text-purple-300">{question.template.text((name) => gateDisplay(name, isPythonMode, false))}</div></div>
                <div className={`flex gap-6 mb-10 ${shake ? 'shake' : ''}`}>
                    <BitBox value={a} label="A" onClick={() => toggleInput('a')} />
                    <BitBox value={b} label="B" onClick={() => toggleInput('b')} />
                    <BitBox value={c} label="C" onClick={() => toggleInput('c')} />
                </div>
                <div className="text-slate-400 text-sm mb-3">RESULT</div>
                <div className="flex gap-6">
                    <button type="button" onClick={() => submit(0)} className="w-20 h-20 rounded-lg font-bold text-3xl bg-slate-700 hover:bg-slate-600 text-white active:scale-95">0</button>
                    <button type="button" onClick={() => submit(1)} className="w-20 h-20 rounded-lg font-bold text-3xl bg-slate-700 hover:bg-slate-600 text-white active:scale-95">1</button>
                </div>
            </GameLayout>
        );
    }
    // level 5: NAND, NOR, XOR - same shape as level 1
    const a5 = inputs.a !== undefined ? inputs.a : question.a;
    const b5 = inputs.b !== undefined ? inputs.b : question.b;
    const gateLabel5 = gateDisplay(question.gate, isPythonMode, isHardMode);
    return (
        <GameLayout stress={stress} score={score} gameSpeed={gameSpeed} onExit={handleExit} onHelp={onHelp} levelName="L5: NAND, NOR, XOR" isHardMode={isHardMode}>
            <div className="text-center mb-8"><div className="text-slate-400 text-sm mb-2">GATE</div><div className="text-6xl font-bold font-mono text-pink-300">{gateLabel5}</div></div>
            <div className={`flex gap-6 mb-10 ${shake ? 'shake' : ''}`}>
                <BitBox value={a5} label="A" onClick={() => toggleInput('a')} />
                <BitBox value={b5} label="B" onClick={() => toggleInput('b')} />
            </div>
            <div className="text-slate-400 text-sm mb-3">RESULT</div>
            <div className="flex gap-6">
                <button type="button" onClick={() => submit(0)} className="w-20 h-20 rounded-lg font-bold text-3xl bg-slate-700 hover:bg-slate-600 text-white active:scale-95">0</button>
                <button type="button" onClick={() => submit(1)} className="w-20 h-20 rounded-lg font-bold text-3xl bg-slate-700 hover:bg-slate-600 text-white active:scale-95">1</button>
            </div>
        </GameLayout>
    );
};

// Level 2: Truth Table Fill. A/B columns are fixed, some Result cells are
// hidden - click a hidden cell to toggle it, the whole table checks
// itself once every hidden cell is correct (same "click to toggle,
// auto-completes when correct" pattern Binary Blitz uses for its own
// bit-toggle levels).
const Level2Comp = ({ onExit, onGameOver, isHardMode, isPythonMode, onHelp }) => {
    const startTimeRef = useRef(Date.now()); const correctRef = useRef(0); const wrongRef = useRef(0);
    const handleGameEnd = useCallback((s) => onGameOver(s, 2, Date.now() - startTimeRef.current, correctRef.current, wrongRef.current), [onGameOver]);
    const handleExit = () => onExit(2, Date.now() - startTimeRef.current, correctRef.current, wrongRef.current, score);
    const { stress, score, resetRound, addStress, gameSpeed } = useGameLoop(true, handleGameEnd, isHardMode);
    const [question, setQuestion] = useState(null);
    const [filled, setFilled] = useState({});
    useEffect(() => { next(); }, []);
    const next = (points = 0) => {
        setQuestion(generateQuestion(2, isHardMode));
        setFilled({});
        resetRound(isHardMode ? Math.floor(points * 2.5) : points);
    };
    const toggleCell = (rowIdx) => {
        const newFilled = { ...filled, [rowIdx]: filled[rowIdx] === undefined ? 1 : (filled[rowIdx] ? 0 : 1) };
        setFilled(newFilled);
        const allCorrect = question.hiddenIndices.every(i => newFilled[i] === question.rows[i].result);
        if (allCorrect) { correctRef.current += 1; setTimeout(() => next(75 + question.hiddenIndices.length * 15), 200); }
    };
    if (!question) return null;
    return (
        <GameLayout stress={stress} score={score} gameSpeed={gameSpeed} onExit={handleExit} onHelp={onHelp} levelName="L2: Truth Table Fill" isHardMode={isHardMode}>
            <div className="text-center mb-6"><div className="text-slate-400 text-sm mb-2">GATE</div><div className="text-4xl font-bold font-mono text-red-300">{gateDisplay(question.gate, isPythonMode, false)}</div></div>
            <table className="border-collapse mb-6">
                <thead><tr>
                    <th className="px-4 py-2 text-slate-400 text-sm border-b border-slate-700">A</th>
                    {question.gate !== 'NOT' && <th className="px-4 py-2 text-slate-400 text-sm border-b border-slate-700">B</th>}
                    <th className="px-4 py-2 text-slate-400 text-sm border-b border-slate-700">Result</th>
                </tr></thead>
                <tbody>
                    {question.rows.map((row, i) => {
                        const isHidden = question.hiddenIndices.includes(i);
                        const value = isHidden ? (filled[i] !== undefined ? filled[i] : '?') : row.result;
                        const isCorrect = isHidden && filled[i] === row.result;
                        return (
                            <tr key={i}>
                                <td className="px-4 py-2 text-center font-mono text-lg text-slate-300 border-b border-slate-800">{row.a}</td>
                                {question.gate !== 'NOT' && <td className="px-4 py-2 text-center font-mono text-lg text-slate-300 border-b border-slate-800">{row.b}</td>}
                                <td className="px-4 py-2 text-center border-b border-slate-800">
                                    {isHidden
                                        ? <button type="button" onClick={() => toggleCell(i)} className={`w-10 h-10 rounded font-bold font-mono text-lg ${isCorrect ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>{value}</button>
                                        : <span className="font-mono text-lg text-slate-500">{value}</span>}
                                </td>
                            </tr>
                        );
                    })}
                </tbody>
            </table>
            <div className="text-xs text-slate-500 uppercase tracking-widest">Click a highlighted box to toggle it between 0 and 1</div>
        </GameLayout>
    );
};

// Level 6: Match the Symbol - a description, six gate buttons.
const Level6Comp = ({ onExit, onGameOver, isHardMode, isPythonMode, onHelp }) => {
    const startTimeRef = useRef(Date.now()); const correctRef = useRef(0); const wrongRef = useRef(0);
    const handleGameEnd = useCallback((s) => onGameOver(s, 6, Date.now() - startTimeRef.current, correctRef.current, wrongRef.current), [onGameOver]);
    const handleExit = () => onExit(6, Date.now() - startTimeRef.current, correctRef.current, wrongRef.current, score);
    const { stress, score, resetRound, addStress, gameSpeed } = useGameLoop(true, handleGameEnd, isHardMode);
    const [question, setQuestion] = useState(null);
    const [shake, setShake] = useState(false);
    useEffect(() => { next(); }, []);
    const next = (points = 0) => {
        setQuestion(generateQuestion(6, isHardMode));
        resetRound(isHardMode ? Math.floor(points * 2.5) : points);
    };
    const pick = (gate) => {
        const correct = gate === question.gate;
        if (correct) { correctRef.current += 1; setTimeout(() => next(100), 200); }
        else { wrongRef.current += 1; setShake(true); setTimeout(() => setShake(false), 500); addStress(0.2); }
    };
    if (!question) return null;
    return (
        <GameLayout stress={stress} score={score} gameSpeed={gameSpeed} onExit={handleExit} onHelp={onHelp} levelName="L6: Match the Symbol" isHardMode={isHardMode}>
            <div className={`text-center mb-10 max-w-lg ${shake ? 'shake' : ''}`}><div className="text-slate-400 text-sm mb-2">WHICH GATE?</div><div className="text-2xl font-bold text-orange-300">{question.description}</div></div>
            <div className="grid grid-cols-3 gap-4 w-full max-w-md">
                {question.options.map(gate => (
                    <button type="button" key={gate} onClick={() => pick(gate)} className="h-16 rounded-lg font-bold text-lg bg-slate-700 hover:bg-slate-600 text-white active:scale-95">{gateDisplay(gate, isPythonMode, false)}</button>
                ))}
            </div>
        </GameLayout>
    );
};

// --- FINAL EXAM: 15 mixed questions from levels 1, 3, 4, 5, 6 (level 2's
// table-fill shape doesn't translate to one-question-at-a-time review the
// same way, so it's left out of the pool - Binary Blitz's own exam
// excludes some of its levels from its random pool the same way) ---
const EXAM_POOL = [1, 3, 4, 5, 6];

const ExamLevel = ({ onExit, onFinish, isHardMode, isPythonMode }) => {
    const startTimeRef = useRef(Date.now());
    const [currentQIndex, setCurrentQIndex] = useState(0);
    const [correctCount, setCorrectCount] = useState(0);
    const [questions, setQuestions] = useState([]);
    const [inputs, setInputs] = useState({});
    useEffect(() => {
        const qs = [];
        for (let i = 0; i < 15; i++) {
            const lvl = EXAM_POOL[Math.floor(Math.random() * EXAM_POOL.length)];
            const q = generateQuestion(lvl, isHardMode);
            q.levelType = lvl;
            qs.push(q);
        }
        setQuestions(qs);
    }, [isHardMode]);
    const handleAnswer = (isCorrect) => {
        if (isCorrect) setCorrectCount(prev => prev + 1);
        if (currentQIndex < 14) { setCurrentQIndex(prev => prev + 1); setInputs({}); }
        else {
            const duration = Date.now() - startTimeRef.current;
            onFinish(correctCount + (isCorrect ? 1 : 0), 15, duration);
        }
    };
    if (questions.length === 0) return <div>Loading Exam...</div>;
    const q = questions[currentQIndex];
    const toggleInput = (key) => setInputs(prev => ({ ...prev, [key]: prev[key] ? 0 : 1 }));
    const renderContent = () => {
        if (q.levelType === 1 || q.levelType === 5) {
            const a = inputs.a !== undefined ? inputs.a : q.a;
            const b = inputs.b !== undefined ? inputs.b : q.b;
            return (
                <div className="flex flex-col items-center">
                    <div className="text-slate-400 text-sm mb-2">GATE</div>
                    <div className="text-5xl font-bold font-mono text-violet-300 mb-6">{gateDisplay(q.gate, isPythonMode, isHardMode)}</div>
                    <div className="flex gap-6 mb-8">
                        <BitBox value={a} label="A" onClick={() => toggleInput('a')} />
                        {q.gate !== 'NOT' && <BitBox value={b} label="B" onClick={() => toggleInput('b')} />}
                    </div>
                    <div className="flex gap-6">
                        <button type="button" onClick={() => handleAnswer(0 === q.result)} className="w-16 h-16 rounded-lg font-bold text-2xl bg-slate-700 hover:bg-slate-600 text-white">0</button>
                        <button type="button" onClick={() => handleAnswer(1 === q.result)} className="w-16 h-16 rounded-lg font-bold text-2xl bg-slate-700 hover:bg-slate-600 text-white">1</button>
                    </div>
                </div>
            );
        }
        if (q.levelType === 3) {
            return (
                <div className="flex flex-col items-center">
                    <div className="text-slate-400 text-sm mb-2">TRUE OR FALSE?</div>
                    <div className="text-5xl font-bold font-mono text-emerald-300 mb-8">{q.a} {opDisplay(q.op, isPythonMode)} {q.b}</div>
                    <div className="flex gap-6">
                        <Button onClick={() => handleAnswer(false === q.result)} variant="danger" className="w-28 h-14">FALSE</Button>
                        <Button onClick={() => handleAnswer(true === q.result)} variant="success" className="w-28 h-14">TRUE</Button>
                    </div>
                </div>
            );
        }
        if (q.levelType === 4) {
            const a = inputs.a !== undefined ? inputs.a : q.a;
            const b = inputs.b !== undefined ? inputs.b : q.b;
            const c = inputs.c !== undefined ? inputs.c : q.c;
            return (
                <div className="flex flex-col items-center">
                    <div className="text-slate-400 text-sm mb-2">EXPRESSION</div>
                    <div className="text-2xl font-bold font-mono text-purple-300 mb-6">{q.template.text((name) => gateDisplay(name, isPythonMode, false))}</div>
                    <div className="flex gap-4 mb-8">
                        <BitBox value={a} label="A" onClick={() => toggleInput('a')} />
                        <BitBox value={b} label="B" onClick={() => toggleInput('b')} />
                        <BitBox value={c} label="C" onClick={() => toggleInput('c')} />
                    </div>
                    <div className="flex gap-6">
                        <button type="button" onClick={() => handleAnswer(0 === q.result)} className="w-16 h-16 rounded-lg font-bold text-2xl bg-slate-700 hover:bg-slate-600 text-white">0</button>
                        <button type="button" onClick={() => handleAnswer(1 === q.result)} className="w-16 h-16 rounded-lg font-bold text-2xl bg-slate-700 hover:bg-slate-600 text-white">1</button>
                    </div>
                </div>
            );
        }
        // levelType 6
        return (
            <div className="flex flex-col items-center max-w-lg">
                <div className="text-slate-400 text-sm mb-2">WHICH GATE?</div>
                <div className="text-xl font-bold text-orange-300 mb-8 text-center">{q.description}</div>
                <div className="grid grid-cols-3 gap-3 w-full max-w-md">
                    {q.options.map(gate => (
                        <button type="button" key={gate} onClick={() => handleAnswer(gate === q.gate)} className="h-14 rounded-lg font-bold bg-slate-700 hover:bg-slate-600 text-white">{gateDisplay(gate, isPythonMode, false)}</button>
                    ))}
                </div>
            </div>
        );
    };
    return (<ExamLayout currentQ={currentQIndex + 1} totalQ={15} onExit={() => onExit(7, 0, 0, 0, 0)}><div className="w-full max-w-3xl mx-auto pt-8">{renderContent()}</div></ExamLayout>);
};

// ============================================================
// MAIN MENU
// ============================================================
const MainMenu = ({ onStart, isHardMode, setHardMode, isPythonMode, setPythonMode, playerName }) => {
    const [helpLevel, setHelpLevel] = useState(null);
    return (
        <div className="flex flex-col items-center h-full p-4 fade-in overflow-y-auto custom-scrollbar relative">
            {helpLevel && <HelpModal levelId={helpLevel} onClose={() => setHelpLevel(null)} />}
            <button
                type="button"
                onClick={() => setPythonMode(!isPythonMode)}
                className={`absolute top-4 right-4 px-3 py-2 rounded-lg border text-xs font-bold tracking-wide transition-colors ${isPythonMode ? 'bg-yellow-500/20 border-yellow-500 text-yellow-300' : 'bg-slate-800 border-slate-600 text-slate-400 hover:text-white'}`}
                title="Switch between Cambridge pseudocode operators (=, <>) and Python operators (==, !=)"
            >
                {isPythonMode ? 'PYTHON' : 'PSEUDOCODE'}
            </button>
            <div className="text-center mb-4 mt-6">
                <h1 className="text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-300 mb-1">BOOLEAN BLITZ</h1>
                <p className="text-slate-400 text-sm">7 Levels.</p>
                <p className="text-violet-400 text-xs mt-1 font-mono">{playerName}</p>
            </div>
            <div className="flex gap-3 mb-5 flex-wrap justify-center items-center">
                <Toggle checked={isHardMode} onChange={setHardMode} label="HARD MODE" />
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 w-full max-w-6xl pb-24">
                {Object.entries(LEVELS).map(([id, data]) => {
                    const scores = getScores(id);
                    const topScore = scores.length > 0 ? scores[0].score : '-';
                    const isExam = id === '7';
                    return (
                        <div key={id} className={`bg-slate-800 rounded-xl p-4 border border-slate-700 hover:border-${data.color}-500 transition-all flex flex-col relative group`}>
                            <div className="flex justify-between items-start mb-2">
                                <h2 className={`${levelTitleSizeClass(data.title)} font-bold leading-tight text-${data.color}-400`}>{data.title}</h2>
                                <button onClick={() => setHelpLevel(id)} className="text-slate-500 hover:text-white bg-slate-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold transition-colors">?</button>
                            </div>
                            <p className="text-xs text-slate-400 mb-4">{data.desc}</p>
                            <div className="flex-1"></div>
                            <div className="flex justify-between items-end mt-4">
                                {isExam ? (
                                    <div className="text-xs text-slate-500">Last: <span className="text-white font-mono">{getExamHistory().length > 0 ? getExamHistory().slice(-1)[0].score + '/15' : '-'}</span></div>
                                ) : (
                                    <div className="text-xs text-slate-500">Best: <span className="text-white font-mono">{topScore}</span></div>
                                )}
                                <button onClick={() => onStart(parseInt(id))} className={`px-4 py-2 rounded-lg bg-${data.color}-600 hover:bg-${data.color}-500 text-white font-bold text-sm shadow-lg`}>{isExam ? 'START' : 'PLAY'}</button>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
};

const GameOver = ({ score, level, onRestart, onHome }) => (
    <div className="flex flex-col items-center justify-center h-full p-4 fade-in space-y-8 text-center bg-slate-900/95 z-50 absolute inset-0">
        <h2 className="text-6xl font-bold text-red-500 shake">GAME OVER</h2>
        <div className="bg-slate-800 p-8 rounded-2xl border-2 border-slate-700 shadow-2xl w-full max-w-sm">
            <p className="text-slate-400 uppercase tracking-widest text-sm mb-2">Level {level} Score</p>
            <p className="text-7xl font-mono font-bold text-white">{score}</p>
        </div>
        <div className="flex flex-col space-y-3 w-full max-w-xs">
            <Button onClick={onRestart} className="w-full text-lg">Try Again</Button>
            <Button onClick={onHome} variant="secondary" className="w-full">Back to Menu</Button>
        </div>
    </div>
);

const ExamResults = ({ score, total, duration, onHome }) => (
    <div className="flex flex-col items-center justify-center h-full p-4 fade-in space-y-8 text-center bg-slate-900 z-50 absolute inset-0">
        <h2 className="text-5xl font-bold text-white mb-4">Exam Complete</h2>
        <div className="bg-slate-800 p-8 rounded-2xl border-2 border-slate-700 shadow-2xl w-full max-w-md">
            <div className="text-slate-400 uppercase tracking-widest text-sm mb-2">Score</div>
            <div className="text-6xl font-mono font-bold text-rose-400 mb-6">{score} <span className="text-2xl text-slate-500">/ {total}</span></div>
            <div className="flex justify-between text-sm border-t border-slate-700 pt-4">
                <span className="text-slate-400">Time Taken:</span>
                <span className="text-white font-mono">{formatTime(duration)}</span>
            </div>
        </div>
        <Button onClick={onHome} variant="primary" className="w-full max-w-xs">Return to Menu</Button>
    </div>
);

// ============================================================
// APP ROOT
// ============================================================
const App = () => {
    const [playerName, setPlayerName] = useState(() => window.__bcPlayerName || 'Player');
    useEffect(() => {
        if (window.__bcPlayerName) { setPlayerName(window.__bcPlayerName); return; }
        const handler = (event) => {
            const data = event.data;
            if (data && data.type === 'BC_IDENTITY' && data.name) setPlayerName(data.name);
        };
        window.addEventListener('message', handler);
        return () => window.removeEventListener('message', handler);
    }, []);
    const [view, setView] = useState('menu');
    const [activeLevel, setActiveLevel] = useState(1);
    const [lastScore, setLastScore] = useState(0);
    const [lastExamStats, setLastExamStats] = useState(null);
    const [isHardMode, setHardMode] = useState(false);
    const [isPythonMode, setPythonMode] = useState(false);
    const [showHelp, setShowHelp] = useState(false);

    const handleGameOver = (score, level, duration, correct, wrong) => {
        saveScore(score, level);
        postToParent({ type: 'BLB_PROGRESS', kind: 'level', level, score, duration, correct, wrong });
        setLastScore(score); setActiveLevel(level); setView('gameover');
    };

    const handleExit = (level, duration, correct, wrong, score) => {
        if (level !== 7) {
            saveScore(score, level);
            postToParent({ type: 'BLB_PROGRESS', kind: 'level', level, score, duration, correct, wrong });
        }
        setView('menu');
    };

    const handleExamFinish = (score, total, duration) => {
        saveExamResult(score, total, duration);
        postToParent({ type: 'BLB_PROGRESS', kind: 'exam', score, total, duration });
        setLastExamStats({ score, total, duration });
        setView('exam_results');
    };

    return (
        <div className="w-full h-full relative">
            {showHelp && <HelpModal levelId={activeLevel} onClose={() => setShowHelp(false)} />}

            {view === 'menu' && (
                <MainMenu
                    onStart={(lvl) => { setActiveLevel(lvl); setView(lvl === 7 ? 'exam' : 'game'); }}
                    isHardMode={isHardMode}
                    setHardMode={setHardMode}
                    isPythonMode={isPythonMode}
                    setPythonMode={setPythonMode}
                    playerName={playerName}
                />
            )}

            {view === 'game' && (
                activeLevel === 2 ? <Level2Comp onExit={handleExit} onGameOver={handleGameOver} isHardMode={isHardMode} isPythonMode={isPythonMode} onHelp={() => setShowHelp(true)} /> :
                activeLevel === 6 ? <Level6Comp onExit={handleExit} onGameOver={handleGameOver} isHardMode={isHardMode} isPythonMode={isPythonMode} onHelp={() => setShowHelp(true)} /> :
                <GenericLevel level={activeLevel} onExit={handleExit} onGameOver={handleGameOver} isHardMode={isHardMode} isPythonMode={isPythonMode} onHelp={() => setShowHelp(true)} />
            )}

            {view === 'exam' && <ExamLevel onExit={(l, d) => handleExit(l, d, 0, 0, 0)} onFinish={handleExamFinish} isHardMode={isHardMode} isPythonMode={isPythonMode} />}
            {view === 'gameover' && <GameOver score={lastScore} level={activeLevel} onRestart={() => setView('game')} onHome={() => setView('menu')} />}
            {view === 'exam_results' && <ExamResults {...lastExamStats} onHome={() => setView('menu')} />}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
