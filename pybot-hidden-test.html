<!DOCTYPE html>
<html><head><title>pybot hidden test</title>
<style>
  .page-view { display: none; width: 100%; height: 100vh; }
  .page-view.active { display: block; }
</style>
</head>
<body style="margin:0">
<div class="page-view" id="page-home"><h1>Home</h1></div>
<div class="page-view" id="page-pybot"><iframe src="TurboBot/pybot.html?bcv=20260821c" style="width:100%;height:100%;border:0"></iframe></div>
<button id="switch" style="position:fixed;top:0;right:0;z-index:999">Switch to PyBot</button>
<script>
document.getElementById('switch').addEventListener('click', function () {
  document.getElementById('page-home').classList.remove('active');
  document.getElementById('page-pybot').classList.add('active');
});
document.getElementById('page-home').classList.add('active');
</script>
</body></html>
