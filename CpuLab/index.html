<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPU Lab</title>
  <link rel="stylesheet" href="../shared/bc-theme.css?v=20260927s">
  <link rel="stylesheet" id="lab-css" href="lab.css">
</head>
<body>
<main>
  <section class="panel" id="activity" aria-live="polite"></section>
</main>
<script>
// CPU Lab (Year 10 3.1). ?activity=ipo (Input, Process, Output: sort each step of a device) or ?activity=run (Run
// the Program: a program and its data in one memory; predict the output, then run it one instruction at a time).
// ?embed=1 sits the lab on a lesson slide. Every file is loaded with the page's bcv.
(function () {
  var params = new URLSearchParams(location.search);
  var v = params.get('bcv') || '1';
  if (params.get('embed') === '1') document.documentElement.classList.add('embed');
  document.getElementById('lab-css').href = 'lab.css?v=' + encodeURIComponent(v);
  var activity = params.get('activity') === 'ipo' ? 'ipo' : 'run';
  ['common.js', activity + '.js'].forEach(function (file) {
    var s = document.createElement('script');
    s.src = file + '?v=' + encodeURIComponent(v);
    s.async = false;
    document.body.appendChild(s);
  });
})();
</script>
<script src="../shared/bc-clicker.js?v=20260929c"></script>
</body>
</html>
