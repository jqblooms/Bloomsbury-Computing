// Overflow Lab (Year 10 and 11, 0478 overflow in an 8-bit register): four stages. Will it fit?, Watch and predict,
// Add it yourself, Exam style. 3 right in a row masters a level; questions never stop; help fades level by level.
// ?embed=1 sits it on a lesson slide; ?stages=fit,watch shows only those stages and posts BC_APP_RESULT.
// Every file is loaded with the page's bcv. Logic test: node tools/test_overflow_lab.mjs
(function () {
  var params = new URLSearchParams(location.search);
  var v = params.get('bcv') || '1';
  if (params.get('embed') === '1') document.documentElement.classList.add('embed');
  document.getElementById('app-css').href = 'style.css?v=' + encodeURIComponent(v);
  ['js/logic.js', 'js/fx.js', 'js/app.js'].forEach(function (file) {
    var s = document.createElement('script');
    s.src = file + '?v=' + encodeURIComponent(v);
    s.async = false;
    document.body.appendChild(s);
  });
})();
</script>
